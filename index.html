<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEE311 - Fluid Kinematics - Example 6</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#222} .wrap{max-width:900px;margin:20px auto;padding:0 16px} h1{font-size:26px;text-align:center;margin:0 0 5px} h2{font-size:21px;font-weight:500;text-align:center;margin:0 0 14px}.eq{text-align:center;font-size:18px;line-height:1.55}.figure{position:relative;margin-top:12px;background:#f3e1bd;border:1px solid #8a7f6c;border-radius:8px;padding:8px}.controls{position:absolute;right:18px;top:18px;z-index:5;display:flex;align-items:flex-start;gap:12px}.rightcontrols{display:flex;flex-direction:column;align-items:center;gap:8px}.timebox{background:rgba(255,255,255,.86);border-radius:6px;padding:5px 9px;text-align:center;font-size:13px;font-weight:700;min-width:92px}.mainbuttons{display:flex;flex-direction:column;gap:7px}.btn{min-width:78px;height:40px;border:1px solid #777;border-radius:6px;background:rgba(255,255,255,.93);font-size:15px;cursor:pointer}.speedbox{background:rgba(255,255,255,.86);border-radius:6px;padding:5px 7px;text-align:center}.speedtitle{font-size:12px;font-weight:700;margin-bottom:4px}.speedbuttons{display:flex;gap:4px}.arrow{width:40px;height:40px;min-width:40px;font-size:22px;font-weight:bold}.speedvalue{font-size:12px;font-weight:700;margin-top:3px}svg{display:block;width:100%;height:auto}.status{text-align:center;margin:7px 0 2px;font-size:14px;color:#555;min-height:18px}@media(max-width:600px){h1{font-size:20px}h2{font-size:17px}.eq{font-size:15px}.controls{right:12px;top:12px;gap:6px}.btn{min-width:65px;height:36px;font-size:13px}.arrow{width:36px;height:36px;min-width:36px}.speedtitle,.speedvalue{font-size:10px}}
</style>
</head>
<body>
<div class="wrap">
<h1>MEE311 - Fluid Mechanics</h1>
<h2>Chapter 3 - Fluid Kinematics - Example 6</h2>
<div class="eq">Velocity field: <strong>u = x²,&nbsp;&nbsp; v = −2xy − 1</strong> &nbsp;(SI units)</div>
<div class="eq">Streamlines: <strong>x²y + x = C</strong></div>
<div class="status" id="status">Click in the flow domain to position the initial square.</div>
<div class="figure">
<div class="controls">
 <div class="mainbuttons"><button class="btn" id="play">Play</button><button class="btn" id="stop">Stop</button><button class="btn" id="restart">Restart</button></div>
 <div class="rightcontrols"><div class="timebox" id="timebox">t = 0.000 s</div><div class="speedbox"><div class="speedtitle">Animation speed</div><div class="speedbuttons"><button class="btn arrow" id="slower" aria-label="Slow down">↓</button><button class="btn arrow" id="faster" aria-label="Speed up">↑</button></div><div class="speedvalue" id="speedvalue">1.00×</div></div></div>
</div>
<svg id="flow" viewBox="0 0 600 600" aria-label="Flow field with streamlines and deforming material volume">
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2478b5"/></marker><clipPath id="clip"><rect x="55" y="25" width="520" height="520"/></clipPath></defs>
<rect x="55" y="25" width="520" height="520" fill="#f3e1bd" stroke="#817766" stroke-width="1.5"/>
<g id="grid" clip-path="url(#clip)"></g><g id="streams" clip-path="url(#clip)"></g><g id="axes"></g>
<g clip-path="url(#clip)"><path id="material" fill="#9fd8b4" fill-opacity=".94" stroke="#496755" stroke-width="2.3" stroke-linejoin="round"/></g>
<text x="315" y="590" text-anchor="middle" font-size="17">x (m)</text><text x="17" y="285" text-anchor="middle" font-size="17" transform="rotate(-90 17 285)">y (m)</text>
</svg>
</div>
</div>
<script>
(()=>{const svg=document.getElementById('flow'),mat=document.getElementById('material'),streams=document.getElementById('streams'),grid=document.getElementById('grid'),axes=document.getElementById('axes'),play=document.getElementById('play'),stopB=document.getElementById('stop'),restart=document.getElementById('restart'),slower=document.getElementById('slower'),faster=document.getElementById('faster'),speedTxt=document.getElementById('speedvalue'),timeBox=document.getElementById('timebox'),status=document.getElementById('status');
const NS='http://www.w3.org/2000/svg',L=55,T=25,W=520,H=520,D=4,side=.4,sx=x=>L+W*x/D,sy=y=>T+H*(1-y/D),mk=(tag,a,p)=>{const e=document.createElementNS(NS,tag);Object.entries(a).forEach(([k,v])=>e.setAttribute(k,v));p.appendChild(e);return e};
for(let i=0;i<=4;i++){mk('line',{x1:sx(i),y1:sy(0),x2:sx(i),y2:sy(4),stroke:'#c7b590','stroke-width':1},grid);mk('line',{x1:sx(0),y1:sy(i),x2:sx(4),y2:sy(i),stroke:'#c7b590','stroke-width':1},grid);mk('text',{x:sx(i),y:sy(0)+22,'text-anchor':'middle','font-size':13,fill:'#333'},axes).textContent=i;if(i)mk('text',{x:sx(0)-10,y:sy(i)+5,'text-anchor':'end','font-size':13,fill:'#333'},axes).textContent=i;}mk('line',{x1:sx(0),y1:sy(0),x2:sx(4),y2:sy(0),stroke:'#292929','stroke-width':1.7},axes);mk('line',{x1:sx(0),y1:sy(0),x2:sx(0),y2:sy(4),stroke:'#292929','stroke-width':1.7},axes);
for(let xs=.25;xs<=3.7501;xs+=.25){const C=4*xs*xs+xs,a=[];for(let x=.015;x<=4;x+=.006){const y=(C-x)/(x*x);if(y>=0&&y<=4)a.push([x,y]);}if(a.length<4)continue;mk('path',{d:a.map((p,i)=>(i?'L':'M')+sx(p[0]).toFixed(1)+','+sy(p[1]).toFixed(1)).join(''),fill:'none',stroke:'#2478b5','stroke-width':1.9},streams);[.35,.68].forEach(fr=>{const j=Math.min(a.length-7,Math.max(0,Math.floor(a.length*fr))),q=j+6;if(q<a.length)mk('line',{x1:sx(a[j][0]),y1:sy(a[j][1]),x2:sx(a[q][0]),y2:sy(a[q][1]),stroke:'#2478b5','stroke-width':1.8,'marker-end':'url(#arr)'},streams);});}
let cx=1,cy=3.65,t=0,speed=1,running=false,last=null,raf=null,finished=false;function boundary(){const h=side/2,n=60,p=[];for(let i=0;i<n;i++)p.push([cx-h+side*i/(n-1),cy-h]);for(let i=1;i<n;i++)p.push([cx+h,cy-h+side*i/(n-1)]);for(let i=1;i<n;i++)p.push([cx+h-side*i/(n-1),cy+h]);for(let i=1;i<n-1;i++)p.push([cx-h,cy+h-side*i/(n-1)]);return p}function adv(xi,yi,tt){const den=1-xi*tt;if(den<=1e-5)return[1e6,-1e6];const x=xi/den,C=xi*xi*yi+xi;return[x,(C-x)/(x*x)]}function pts(tt){return boundary().map(p=>adv(p[0],p[1],tt))}const visible=p=>Number.isFinite(p[0])&&Number.isFinite(p[1])&&p[0]>=0&&p[0]<=4&&p[1]>=0&&p[1]<=4;function draw(){const p=pts(t);mat.setAttribute('d',p.map((q,i)=>(i?'L':'M')+sx(q[0]).toFixed(1)+','+sy(q[1]).toFixed(1)).join('')+'Z');speedTxt.textContent=speed.toFixed(2)+'×';timeBox.textContent='t = '+t.toFixed(3)+' s';}function halt(){running=false;if(raf)cancelAnimationFrame(raf);raf=null;last=null}function tick(now){if(!running)return;if(last===null)last=now;t+=Math.min(.025,(now-last)/1000)*speed;last=now;const p=pts(t);draw();if(!p.some(visible)){finished=true;halt();status.textContent='Material volume has completely left the flow domain.';return;}raf=requestAnimationFrame(tick)}
play.addEventListener('click',()=>{if(finished){t=0;finished=false;draw()}if(!running){running=true;last=null;raf=requestAnimationFrame(tick)}});stopB.addEventListener('click',()=>{halt();status.textContent='Animation stopped.'});restart.addEventListener('click',()=>{halt();t=0;finished=false;status.textContent='Click in the flow domain to reposition the initial square, or press Play.';draw()});slower.addEventListener('click',()=>{speed=Math.max(.05,speed/1.5);draw()});faster.addEventListener('click',()=>{speed=Math.min(8,speed*1.5);draw()});
svg.addEventListener('pointerdown',e=>{const r=svg.getBoundingClientRect(),vx=(e.clientX-r.left)*600/r.width,vy=(e.clientY-r.top)*600/r.height;let x=(vx-L)*D/W,y=(1-(vy-T)/H)*D;if(x<0||x>4||y<0||y>4)return;const h=side/2;cx=Math.max(h,Math.min(4-h,x));cy=Math.max(h,Math.min(4-h,y));halt();t=0;finished=false;draw();status.textContent='Initial material volume positioned. Press Play.'});draw();})();
</script>
</body>
</html>
